name: jellyfin

services:
  jellyfin:
    # Pinned 2026-10-26 (12.3, Debian trixie ca-certificates 20250419+deb13u1: rejects both eMudhra test chains; SECURITY-AUDIT #8).
    # 10.11 -> 12 ran one-way DB migrations: snapshot jellyfin-config before any bump, restore it to roll back.
    image: jellyfin/jellyfin:12.3@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5
    container_name: jellyfin
    restart: unless-stopped
    environment:
      JELLYFIN_DATA_DIR: /config
      JELLYFIN_CACHE_DIR: /cache
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - jellyfin-media:/media
    networks:
      - jellyfin
    devices:
      - /dev/dri:/dev/dri

volumes:
  jellyfin-config:
  jellyfin-cache:
  jellyfin-media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/tank/shared/jellyfin/media

networks:
  jellyfin:
    driver: bridge
