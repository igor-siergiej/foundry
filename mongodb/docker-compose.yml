services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      # bind to LAN + tailscale only — not exposed on 0.0.0.0/WAN
      - '192.168.68.17:27017:27017'   # LAN: on-host apps (kivo, shoppingo-api) via infra-mongodb.imapps.uk
      - '100.79.92.93:27017:27017'   # tailscale: remote debugging over tailnet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb-data:/data/db
    networks:
      - dokploy-network

volumes:
  mongodb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/tank/shared/mongodb

networks:
  dokploy-network:
    external: true
