services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      # bind to LAN + tailscale only — not exposed on 0.0.0.0/WAN
      - '192.168.68.18:27017:27017'   # LAN: on-host apps (kivo, shoppingo-api) via infra-mongodb.imapps.uk
      - '100.85.189.60:27017:27017'   # tailscale: remote debugging over tailnet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb-data:/data/db
    networks:
      - default

volumes:
  mongodb-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.68.13,vers=4,soft,timeo=180,tcp,rw,nolock
      device: ":/mnt/tank/shared/mongodb"
