services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    # No host ports and no Traefik route: Mongo speaks its own wire protocol,
    # so there is no HTTP ingress to put in front of it. Apps reach it as
    # mongodb:27017 over dokploy-network. Admin access: `docker exec -it
    # mongodb mongosh` on the host (see README for a GUI tunnel).
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb-data:/data/db
    networks:
      - dokploy-network

volumes:
  mongodb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/tank/shared/mongodb

networks:
  dokploy-network:
    external: true
