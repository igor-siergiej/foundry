name: minio-gallery

# Filestash: web S3 browser with image thumbnails + gallery viewer.
# Talks to RustFS internally over dokploy-network at http://rustfs:9000
# (endpoint + keys entered on the S3 login form, see README).
# Same-origin https via Traefik/cloudflared -> no mixed-content issues.
services:
  filestash:
    # Pinned 2026-10-26 (:latest built 2026-10-26, go1.26.10 + Debian bundle that rejects the eMudhra intermediates, CVE-2026-111943; SECURITY-AUDIT #8); Dependabot bumps via :latest's new digest
    image: machines/filestash@sha256:35e7d17f8cb07e8ac7ca0daf85940b15047d35622761060318395091b48890b5
    container_name: minio-gallery
    restart: unless-stopped
    environment:
      APPLICATION_URL: minio-gallery.imapps.uk
      CANARY: "false"
    volumes:
      - filestash-state:/app/data/state
    networks:
      - dokploy-network

volumes:
  filestash-state:
    driver: local

networks:
  dokploy-network:
    external: true
