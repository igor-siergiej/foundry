name: minio-gallery

# Filestash: web S3 browser with image thumbnails + gallery viewer.
# Talks to RustFS internally over dokploy-network at http://rustfs:9000
# (endpoint + keys entered on the S3 login form, see README).
# Same-origin https via Traefik/cloudflared -> no mixed-content issues.
services:
  filestash:
    # Pinned 2026-10-18 (SECURITY-AUDIT #8); Dependabot bumps via :latest's new digest
    image: machines/filestash@sha256:edb76ccdfeec1e512b40045f531bb3ceb2c0808960609c7f17ab356dd71b0626
    container_name: minio-gallery
    restart: unless-stopped
    environment:
      APPLICATION_URL: minio-gallery.imapps.uk
      CANARY: "false"
    volumes:
      - filestash-state:/app/data/state
    networks:
      - dokploy-network

volumes:
  filestash-state:
    driver: local

networks:
  dokploy-network:
    external: true
