services:
  blocky:
    # Pinned 2026-10-18 (SECURITY-AUDIT #8); Dependabot bumps via :latest's new digest
    image: spx01/blocky@sha256:595136fb127f4c952b621113e668c09acdcf15ac054d96ee6d4c51a76c35f5fd
    container_name: blocky
    # LAN-wide resolver: always come back, even after a daemon restart.
    restart: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./config.yml:/app/config.yml:ro
    healthcheck:
      # The image is distroless - no shell, no curl. blocky ships its own
      # healthcheck subcommand, which is the only thing that works here.
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - infra
      - dokploy-network

networks:
  infra:
    driver: bridge
  dokploy-network:
    external: true
