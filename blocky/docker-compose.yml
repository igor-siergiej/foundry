services:
  blocky:
    image: spx01/blocky:latest
    container_name: blocky
    # LAN-wide resolver: always come back, even after a daemon restart.
    restart: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./config.yml:/app/config.yml:ro
    healthcheck:
      # The image is distroless - no shell, no curl. blocky ships its own
      # healthcheck subcommand, which is the only thing that works here.
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - infra
      - dokploy-network

networks:
  infra:
    driver: bridge
  dokploy-network:
    external: true
