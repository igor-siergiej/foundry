name: tailscale

services:
  tailscale:
    # Pinned 2026-10-26 (v1.104.2, go1.27.3: eMudhra intermediates blocked, CVE-2026-111943; SECURITY-AUDIT #8); Dependabot bumps via :latest's new digest
    image: tailscale/tailscale@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    container_name: tailscale
    hostname: foundry
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_ROUTES: 192.168.68.0/24
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: false
    restart: unless-stopped

volumes:
  tailscale-state:
