name: resilio-sync

services:
  resilio-sync:
    image: lscr.io/linuxserver/resilio-sync:latest
    container_name: resilio-sync
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - resilio-config:/config
      - notes:/sync/notes
    ports:
      # bind to tailscale only — not exposed on 0.0.0.0/WAN or LAN
      - '100.79.92.93:8888:8888'       # web UI
      - '100.79.92.93:55555:55555'     # sync (tcp)
      - '100.79.92.93:55555:55555/udp' # sync (udp)
    networks:
      - dokploy-network

volumes:
  resilio-config:
    driver: local
  notes:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/tank/shared/notes

networks:
  dokploy-network:
    external: true
