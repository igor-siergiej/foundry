name: resilio-sync

services:
  resilio-sync:
    # Official image; the notes folder pairing lives in the resilio-config2 volume
    # (/mnt/sync/config), added through the web UI.
    # Pinned 2026-10-18 (SECURITY-AUDIT #8); Dependabot bumps via :latest's new digest
    image: resilio/sync@sha256:c5dbffd432c0621414e3c8daa66d453553c4bf80f6727b91fbff4b3ec08a87b5
    container_name: resilio-sync
    restart: unless-stopped
    # Run as `home` so synced files stay owned by uid 1000 and editable by agents on the host.
    user: '1000:1000'
    environment:
      - TZ=Europe/London
    volumes:
      - resilio-config2:/mnt/sync
      - notes:/mnt/sync/notes
    ports:
      # bind to tailscale only — not exposed on 0.0.0.0/WAN or LAN
      - '100.79.92.93:8888:8888'       # web UI
      - '100.79.92.93:55555:55555'     # sync (tcp)
      - '100.79.92.93:55555:55555/udp' # sync (udp)
    networks:
      - dokploy-network

volumes:
  resilio-config2:
    driver: local
  notes:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/tank/shared/notes

networks:
  dokploy-network:
    external: true
