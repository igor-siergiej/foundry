services:
  docker-socket-proxy:
    # Per SECURITY-AUDIT #10: mount-only :ro is meaningless on a Unix socket —
    # the Docker API is the same surface. tecnativa/docker-socket-proxy with
    # CONTAINERS=1+NETWORKS=1 limits the API to what's needed for promtail's
    # docker_sd_configs: /containers (list, inspect, logs) + /networks (label
    # enrichment — promtail calls this for every container even if no
    # __meta_docker_network_* label is used). Everything else — image build,
    # exec, container create, volume mount — stays 403. Logs come from
    # /var/lib/docker/containers/* via a read bind, not the API.
    # Pinned 2026-10-18 (SECURITY-AUDIT #8); Dependabot bumps via :latest's new digest
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    user: "10001:10001"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./config/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/var/lib/promtail
    networks:
      - monitoring
    depends_on:
      - loki
      - docker-socket-proxy

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
      - dokploy-network

  cadvisor:
    # 0.52.1 only exports id="/" on foundry's Docker 29 + containerd snapshotter
    # ("failed to identify the read-write layer ID" spams the logs and there are no
    # per-container series). Bumped to 0.55.1 which supports the containerd
    # snapshotter; per-container `name=` labels come back for the
    # tandra/jewellery/kivo panels. Dependabot bumps further from here.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --housekeeping_interval=10s
      - --docker_only=true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

  grafana:
    # Pinned 2026-10-26 (12.4.13; SECURITY-AUDIT #8). Still go1.26.9, so Go does not block the eMudhra
    # intermediates, and its Alpine bundle trusts the emSign chain (rejects the AAA one). No Grafana
    # release is on go1.26.10 / go1.27.3 yet; release-12.4.14 is go1.26.10: bump to 12.4.14 when it ships.
    image: grafana/grafana:12.4.13@sha256:41bbc1b5e04416f81891806076db2a2ff60a5d4da5f78d36a88b033a8c199185
    container_name: grafana
    restart: unless-stopped
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.imapps.uk
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - monitoring
      - dokploy-network
    depends_on:
      - loki
      - prometheus
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.enable=true
      - traefik.http.routers.grafana-web.rule=Host(`grafana.imapps.uk`)
      - traefik.http.routers.grafana-web.entrypoints=web
      - traefik.http.routers.grafana-web.service=grafana-web
      - traefik.http.routers.grafana-web.middlewares=redirect-to-https@file
      - traefik.http.services.grafana-web.loadbalancer.server.port=3000
      - traefik.http.routers.grafana-websecure.rule=Host(`grafana.imapps.uk`)
      - traefik.http.routers.grafana-websecure.entrypoints=websecure
      - traefik.http.routers.grafana-websecure.service=grafana-websecure
      - traefik.http.routers.grafana-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.grafana-websecure.loadbalancer.server.port=3000

  gatus:
    # Pinned 2026-10-26 (:latest built 2026-10-23 from fae6ede, go1.27.3: eMudhra intermediates blocked, CVE-2026-111943; SECURITY-AUDIT #8); Dependabot bumps via :latest's new digest
    image: twinproduction/gatus@sha256:d04f9cc90641cb9728fa04c635da5c290258047c91ca0d3b3a50da7be407c5cf
    container_name: gatus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    volumes:
      # Mount the directory, not the file: a git pull replaces config.yaml with
      # a new inode, which a single-file bind mount never sees. Gatus
      # hot-reloads the file when it changes.
      - ./config/gatus:/config:ro
      - gatus-data:/data
    networks:
      - dokploy-network
      - monitoring
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.enable=true
      - traefik.http.routers.gatus-web.rule=Host(`gatus.imapps.uk`)
      - traefik.http.routers.gatus-web.entrypoints=web
      - traefik.http.routers.gatus-web.service=gatus-web
      - traefik.http.routers.gatus-web.middlewares=redirect-to-https@file
      - traefik.http.services.gatus-web.loadbalancer.server.port=8080
      - traefik.http.routers.gatus-websecure.rule=Host(`gatus.imapps.uk`)
      - traefik.http.routers.gatus-websecure.entrypoints=websecure
      - traefik.http.routers.gatus-websecure.service=gatus-websecure
      - traefik.http.routers.gatus-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.gatus-websecure.loadbalancer.server.port=8080
      # Allow iframe embedding in Sentinel
      - traefik.http.middlewares.gatus-iframe.headers.customResponseHeaders.X-Frame-Options=
      - traefik.http.middlewares.gatus-iframe.headers.contentSecurityPolicy=frame-ancestors 'self' https://sentinel.imapps.uk
      - traefik.http.routers.gatus-websecure.middlewares=gatus-iframe@docker

volumes:
  loki-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/tank/shared/loki
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/tank/shared/prometheus
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/tank/shared/grafana
  gatus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/tank/shared/gatus
  promtail-positions:
    driver: local

networks:
  monitoring:
    driver: bridge
  dokploy-network:
    external: true
