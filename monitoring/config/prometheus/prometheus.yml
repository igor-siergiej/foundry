global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
    metrics_path: /metrics

  - job_name: blocky
    static_configs:
      - targets: ["blocky:4000"]
    metrics_path: /metrics

  # Tandra API — exposes Prometheus metrics at /api/metrics.
  # Reachable on dokploy-network via the Dokploy appName (swarm service name) of
  # the tandra-api app. If the app is recreated and its appName changes, update the target.
  - job_name: tandra-api
    static_configs:
      - targets: ["app-hack-neural-circuit-s9qq5e:4001"]
        labels:
          service: tandra-api
    metrics_path: /api/metrics

  # Kivo auth service — exposes Prometheus metrics at /metrics.
  - job_name: kivo
    static_configs:
      - targets: ["kivo-api-1pae1e:3008"]
        labels:
          service: kivo
    metrics_path: /metrics

  # Jewellery Catalogue API — exposes Prometheus metrics at /api/metrics.
  # Reachable on dokploy-network via the dokploy-managed service DNS alias.
  - job_name: jewellery-catalogue-api
    static_configs:
      - targets: ["apps-jewellerycatalogueapi-e7gjl7:4001"]
        labels:
          service: jewellery-catalogue-api
    metrics_path: /api/metrics
