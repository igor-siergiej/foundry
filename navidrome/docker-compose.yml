name: navidrome

services:
  navidrome:
    # Pinned 2026-10-18 (SECURITY-AUDIT #8); Dependabot bumps via :latest's new digest
    image: deluan/navidrome@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
    container_name: navidrome
    restart: unless-stopped
    environment:
      ND_LOGFORMAT: json
      ND_LOGFRAME: "false"
      ND_BASEURL: ""
    volumes:
      - navidrome-config:/data
      - navidrome-music:/music:ro
    networks:
      - navidrome

volumes:
  navidrome-config:
    driver: local
  navidrome-music:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/tank/shared/navidrome

networks:
  navidrome:
    driver: bridge
