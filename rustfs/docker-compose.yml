name: rustfs

# S3-compatible object storage replacing ../minio (SECURITY-AUDIT #6, jott #99).
services:
  rustfs:
    # 1.0.3, pinned by digest; Dependabot bumps it.
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    container_name: rustfs
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    # No host ports. Apps reach the S3 API as rustfs:9000 over dokploy-network.
    # The console (:9001) is routed by a Dokploy domain: rustfs-console.imapps.uk.
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: https://rustfs-console.imapps.uk
      # The image logs to /logs inside the container; also mirror to stdout so
      # promtail/Loki pick them up via the Docker log driver.
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
    volumes:
      - rustfs-data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  rustfs-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # ZFS dataset tank/shared/rustfs, owned 10001:10001 (the image's rustfs user).
      device: /mnt/tank/shared/rustfs

networks:
  dokploy-network:
    external: true
