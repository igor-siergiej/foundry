name: mixtape

# Mixtape — YouTube downloader.
# Images built + pushed by the mixtape repo CI (github.com/igor-siergiej/mixtape).
# Audio jobs → mp3 into the Navidrome share (read-write here, read-only there).
# Video jobs → mp4 into the Jellyfin media root, under a YouTube/ subfolder.

services:
  api:
    # Pinned to digest (SECURITY-AUDIT #8); mixtape-app CI must bump `mixtape-api` in this file.
    # The repo previously used :latest because Dokploy reused stale local images without
    # --pull. Pinning the digest captures the exact image and CI must push a new tag + bump
    # the digest here.
    image: docker.io/igurusama/imapps@sha256:6af2f436d8cb9b365092e95279864be866e8a3276a33f8c81bf3c9108f29deb3
    pull_policy: always
    container_name: mixtape-api
    restart: unless-stopped
    environment:
      PORT: 3001
      AUTH_URL: ${AUTH_URL}
      USER_LIBRARIES: ${USER_LIBRARIES}
      MUSIC_ROOT: /music
      # Video jobs land in ${JELLYFIN_ROOT}/YouTube/ — mixtape-video is the Jellyfin media root.
      JELLYFIN_ROOT: /videos
      MIX_CAP: 50
      # Durable per-user job history. Reuses the shared infra mongo (scoped mixtape user).
      CONNECTION_URI: ${CONNECTION_URI}
      DATABASE_NAME: ${DATABASE_NAME}
    volumes:
      - mixtape-music:/music
      - mixtape-video:/videos
    networks:
      - mixtape
      # Direct container-to-container path to shared infra mongo — no host IP hop.
      - dokploy-network

  web:
    # Pinned to digest (SECURITY-AUDIT #8); mixtape-app CI must bump `mixtape-web` here.
    image: docker.io/igurusama/imapps@sha256:08bca160b050b71f1cae11d41e6b19ff2d179bbade48d770f3cacef4e27e36f6
    pull_policy: always
    container_name: mixtape-web
    restart: unless-stopped
    depends_on:
      - api
    # No host port — Traefik routes mixtape.imapps.uk to this container's :3000.
    expose:
      - "3000"
    # Runtime frontend config (AUTH_URL) — Dokploy file mount, overrides the
    # localhost default baked into the web image at build time.
    volumes:
      - /etc/dokploy/compose/compose-parse-1080p-microchip-k6mk71/files/config.json:/usr/share/nginx/html/config.json:ro
    networks:
      - mixtape

volumes:
  mixtape-music:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/tank/shared/navidrome
  # Jellyfin media root. Mixtape writes mp4s into <this>/YouTube/; add that as a
  # Jellyfin library. Same share Jellyfin serves from (jellyfin-media in foundry/jellyfin).
  mixtape-video:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/tank/shared/jellyfin/media

networks:
  mixtape:
    driver: bridge
  dokploy-network:
    external: true
