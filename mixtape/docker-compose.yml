name: mixtape

# Mixtape — YouTube → mp3 → Navidrome library downloader.
# Images built + pushed by the mixtape repo CI (github.com/igor-siergiej/mixtape).
# Writes mp3s into the same NFS share Navidrome reads (read-write here, read-only there).

services:
  api:
    image: docker.io/igurusama/imapps:mixtape-api-latest
    # Always re-pull :latest — otherwise Dokploy reuses the stale local image and never deploys new code.
    pull_policy: always
    container_name: mixtape-api
    restart: unless-stopped
    environment:
      PORT: 3001
      AUTH_URL: ${AUTH_URL}
      USER_LIBRARIES: ${USER_LIBRARIES}
      MUSIC_ROOT: /music
      MIX_CAP: 50
    volumes:
      - mixtape-music:/music
    networks:
      - mixtape

  web:
    image: docker.io/igurusama/imapps:mixtape-web-latest
    pull_policy: always
    container_name: mixtape-web
    restart: unless-stopped
    depends_on:
      - api
    # No host port — Traefik routes mixtape.imapps.uk to this container's :3000.
    expose:
      - "3000"
    # Runtime frontend config (AUTH_URL) — Dokploy file mount, overrides the
    # localhost default baked into the web image at build time.
    volumes:
      - /etc/dokploy/compose/compose-parse-1080p-microchip-k6mk71/files/config.json:/usr/share/nginx/html/config.json:ro
    networks:
      - mixtape

volumes:
  mixtape-music:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.68.13,vers=4,soft,timeo=180,tcp,rw,nolock
      device: ":/mnt/tank/shared/navidrome"

networks:
  mixtape:
    driver: bridge
