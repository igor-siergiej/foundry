name: ntfy

# Push notifications for the kanban-cli factory dispatcher (jott cards
# kanban-cli #171): it POSTs to http://100.79.92.93:8090/jott-factory when a
# card ends blocked or done, and the ntfy Android app subscribes to that topic.
#
# Tailnet only, like jott: published on foundry's tailnet IP, no Traefik
# route, no public DNS, no auth (everything on the tailnet is Igor's).

services:
  ntfy:
    # Pinned 2026-10-24 (v2.14.0)
    image: binwiederhier/ntfy@sha256:5a051798d14138c3ecb12c038652558ab6a077e1aceeb867c151cbf5fa8451ef
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: http://100.79.92.93:8090
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 24h
      NTFY_BEHIND_PROXY: "false"
      TZ: UTC
    ports:
      - "100.79.92.93:8090:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ntfy-cache:
