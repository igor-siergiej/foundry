name: audiobookshelf

services:
  audiobookshelf:
    # Pinned 2026-10-24 (v2.37.2, Node 24.22.1 for CVE-2026-111497; SECURITY-AUDIT #8); Dependabot bumps via :latest's new digest
    image: advplyr/audiobookshelf@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      AUDIOBOOKSHELF_UID: 1000
      AUDIOBOOKSHELF_GID: 1000
    volumes:
      - audiobookshelf-config:/config
      - audiobookshelf-books:/audiobooks:ro
    networks:
      - audiobookshelf

volumes:
  audiobookshelf-config:
    external: true
  audiobookshelf-books:
    external: true

networks:
  audiobookshelf:
    driver: bridge
