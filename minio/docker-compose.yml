services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      # bind to LAN + tailscale only — not exposed on 0.0.0.0/WAN
      - '192.168.68.18:9000:9000'    # LAN: on-host apps (shoppingo-api, jewellery-catalogue-api) via minio-ui.imapps.uk
      - '100.85.189.60:9000:9000'    # tailscale: remote access over tailnet
      - '192.168.68.18:9001:9001'    # LAN: MinIO console
      - '100.85.189.60:9001:9001'    # tailscale: MinIO console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - dokploy-network

volumes:
  minio-data:
    external: true

networks:
  dokploy-network:
    external: true
