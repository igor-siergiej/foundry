services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      # tailnet only. On-host apps reach this as minio:9000 over
      # dokploy-network — never via a host IP, which a DHCP lease can move.
      # S3 API is also routed publicly by Traefik at minio.imapps.uk.
      - '100.79.92.93:9000:9000'    # tailscale: remote access over tailnet
      - '100.79.92.93:9001:9001'    # tailscale: MinIO console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - dokploy-network

volumes:
  minio-data:
    external: true

networks:
  dokploy-network:
    external: true
