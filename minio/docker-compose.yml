services:
  minio:
    # Pinned 2026-10-18 to the locally cached RELEASE.2025-09-07T16-13-09Z
    # (SECURITY-AUDIT #6, jott #99): upstream stopped publishing images, so
    # `:latest` can no longer be pulled. Being replaced by ../rustfs.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio
    restart: unless-stopped
    # No host ports. Apps reach the S3 API as minio:9000 over dokploy-network;
    # everything else goes through Traefik (Dokploy domains on this compose):
    #   minio.imapps.uk         -> :9000 S3 API
    #   minio-console.imapps.uk -> :9001 web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - dokploy-network

volumes:
  minio-data:
    external: true

networks:
  dokploy-network:
    external: true
