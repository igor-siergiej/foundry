services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    # No host ports. Apps reach the S3 API as minio:9000 over dokploy-network;
    # everything else goes through Traefik (Dokploy domains on this compose):
    #   minio.imapps.uk         -> :9000 S3 API
    #   minio-console.imapps.uk -> :9001 web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - dokploy-network

volumes:
  minio-data:
    external: true

networks:
  dokploy-network:
    external: true
