debug: false
metrics: true
storage:
  type: sqlite
  path: /data/data.db
ui:
  title: "Homelab Status"
  header: "Service Uptime"
alerting:
  discord:
    webhook-url: "${DISCORD_WEBHOOK_URL}"
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
endpoints:
  - name: Shoppingo Cert Expiration
    group: Infrastructure
    url: https://shoppingo.imapps.uk
    interval: 3600s
    timeout: 10s
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 14d"
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 1

  - name: Kivo Cert Expiration
    group: Infrastructure
    url: https://kivo.imapps.uk
    interval: 3600s
    timeout: 10s
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 14d"
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 1

  - name: Dokploy Cert Expiration
    group: Infrastructure
    url: https://dokploy.imapps.uk
    interval: 3600s
    timeout: 10s
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 14d"
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 1

  - name: DNS Resolution
    group: Infrastructure
    url: tcp://1.1.1.1:53
    interval: 300s
    timeout: 10s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord

  - name: ICMP Ping (Home)
    group: Infrastructure
    url: icmp://192.168.68.1
    interval: 60s
    timeout: 5s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord

  - name: MongoDB
    group: Storage
    url: tcp://mongodb:27017
    interval: 60s
    timeout: 10s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord

  - name: MinIO (Storage)
    group: Storage
    url: http://minio:9000/minio/health/live
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Immich (Photos)
    group: Media
    url: http://immich-server:2283/api/server/ping
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Jellyfin (Media)
    group: Media
    url: http://jellyfin:8096/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Navidrome (Music)
    group: Media
    url: http://navidrome:4533/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: AudiobookShelf
    group: Media
    url: http://audiobookshelf:80/ping
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Vaultwarden
    group: Core
    # Isolated on its own `vaultwarden` network (deliberately, per the
    # docker-compose.yml comment) so Gatus can't reach it by container DNS —
    # hit the public route the same way the cert-expiration checks do.
    url: https://vault.imapps.uk/alive
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Blocky (DNS)
    group: Core
    url: http://blocky:4000/api/blocking/status
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Home Assistant
    group: Core
    url: http://homeassistant:8123/manifest.json
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Kivo (API)
    group: Apps
    url: http://kivo-api-1pae1e:3008/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == healthy"
    alerts:
      - type: discord

  - name: Prometheus
    group: Monitoring
    url: http://prometheus:9090/-/healthy
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Grafana
    group: Monitoring
    url: http://grafana:3000/api/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Loki (Logs)
    group: Monitoring
    url: http://loki:3100/ready
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  # Dokploy swarm apps are addressed by their service name (appName incl. the
  # random suffix), same as Kivo above. If an app is recreated with a new
  # suffix, update the host here and in monitoring/config/prometheus.
  - name: Shoppingo (API)
    group: Apps
    url: http://shoppingo-api-zlusv1:4001/api/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == healthy"
    alerts:
      - type: discord

  - name: Shoppingo (Web)
    group: Apps
    url: http://shoppingo-web-hbnhxf:3000/
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Jewellery Catalogue (API)
    group: Apps
    url: http://apps-jewellerycatalogueapi-e7gjl7:4001/api/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Jewellery Catalogue (Web)
    group: Apps
    url: http://apps-jewellerycatalogueweb-iltgmg:3000/
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Mixtape (API)
    group: Apps
    url: http://mixtape-api:3001/api/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == healthy"
    alerts:
      - type: discord

  - name: Mixtape (Web)
    group: Apps
    url: http://mixtape-web:3000/
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Sentinel (API)
    group: Apps
    url: http://sentinel-api-vnfxap:4001/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == healthy"
    alerts:
      - type: discord

  - name: Sentinel (Web)
    group: Apps
    url: http://sentinel-web-jjol8g:3000/
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: GTNH (Minecraft)
    group: Apps
    # Lives only on the tailnet (network_mode: service:gtnh-tailscale);
    # blocky forwards ts.net to MagicDNS so this resolves from bridge nets.
    url: tcp://gtnh.tail2d4575.ts.net:25565
    interval: 120s
    timeout: 10s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord

  - name: Dokploy
    group: Core
    url: http://dokploy:3000/api/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Cloudflared Tunnel (remote path)
    group: Core
    # Resolve via 1.1.1.1 instead of blocky so the request takes the real
    # remote path: CF edge -> tunnel -> Traefik. gatus is an Access bypass app.
    url: https://gatus.imapps.uk/health
    client:
      dns-resolver: tcp://1.1.1.1:53
    interval: 120s
    timeout: 15s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: OpenSearch
    group: Storage
    # Single node, so replicas never allocate and yellow is normal.
    url: http://opensearch:9200/_cluster/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status != red"
    alerts:
      - type: discord

  - name: MinIO Gallery
    group: Storage
    url: http://minio-gallery:8334/healthz
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Resilio Sync
    group: Storage
    # GUI requires login; 401 means the service is up.
    url: http://resilio-sync:8888/gui/
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 401"
    alerts:
      - type: discord
