debug: false
metrics: true
storage:
  type: sqlite
  path: /data/data.db
ui:
  title: "Homelab Status"
  header: "Service Uptime"
endpoints:
  - name: Domain Expiration
    group: Infrastructure
    url: https://imapps.uk
    interval: 3600s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 7d"

  - name: DNS Resolution
    group: Infrastructure
    url: dns://1.1.1.1
    dns:
      query-name: "imapps.uk"
      query-type: "A"
    interval: 300s
    timeout: 10s
    conditions:
      - "[DNS_RCODE] == NOERROR"

  - name: ICMP Ping (Home)
    group: Infrastructure
    url: icmp://192.168.68.1
    interval: 60s
    timeout: 5s
    conditions:
      - "[CONNECTED] == true"

  - name: NFS Server
    group: Infrastructure
    url: icmp://192.168.68.13
    interval: 60s
    timeout: 5s
    conditions:
      - "[CONNECTED] == true"

  - name: MongoDB
    group: Storage
    url: tcp://mongodb:27017
    interval: 60s
    timeout: 10s
    conditions:
      - "[CONNECTED] == true"

  - name: MinIO (Storage)
    group: Storage
    url: http://host.docker.internal:9000/minio/health/live
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"

  - name: Immich (Photos)
    group: Media
    url: http://host.docker.internal:2283/api/server/about
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"

  - name: Jellyfin (Media)
    group: Media
    url: http://jellyfin:8096/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"

  - name: Navidrome (Music)
    group: Media
    url: http://navidrome:4533/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"

  - name: AudiobookShelf
    group: Media
    url: http://host.docker.internal:13378/ping
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"

  - name: Blocky (DNS)
    group: Core
    url: http://host.docker.internal:4000/api/blocking/status
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"

  - name: Home Assistant
    group: Core
    url: http://host.docker.internal:8123/manifest.json
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"

  - name: Kivo (API)
    group: Apps
    url: http://kivo-api-1pae1e:3008/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == healthy"

  - name: Prometheus
    group: Monitoring
    url: http://prometheus:9090/-/healthy
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"

  - name: Grafana
    group: Monitoring
    url: http://grafana:3000/api/health
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"

  - name: Loki (Logs)
    group: Monitoring
    url: http://loki:3100/ready
    interval: 60s
    timeout: 10s
    conditions:
      - "[STATUS] == 200"
