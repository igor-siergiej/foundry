name: gtnh

services:
  gtnh:
    image: igurusama/imapps:gtnh-latest
    container_name: gtnh
    restart: unless-stopped
    pull_policy: always
    network_mode: "service:gtnh-tailscale"
    depends_on:
      - gtnh-tailscale
    environment:
      LEVEL_NAME: OmniSlop
      MC_USERNAMES: ${MC_USERNAMES}
      MIN_RAM: 8G
      MAX_RAM: 8G
      JDK_JAVA_OPTIONS: >-
        -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200
        -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch
        -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M
        -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4
        -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90
        -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32
        -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1
    volumes:
      - gtnh-data:/data

  gtnh-tailscale:
    image: tailscale/tailscale:latest
    container_name: gtnh-tailscale
    hostname: gtnh
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - gtnh-tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_GTNH}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: false

volumes:
  gtnh-data:
  gtnh-tailscale-state:
