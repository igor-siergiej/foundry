name: umami

# Tandra self-hosted analytics (#72). The dashboard is tailnet/LAN-only:
# there is no public DNS record for `analytics.imapps.uk`, so the Cloudflare
# edge never routes it into the tunnel (homelab.md §3.5). LAN and tailnet
# clients resolve it via blocky to 192.168.68.17 (the tailnet reaches that
# through foundry's subnet route) and hit Traefik on :443.
#
# The tracker is public (tandra #138): Traefik also routes a fixed set of
# paths on the Tandra app's own host to umami, so every visitor loads the
# scripts and sends data same-origin, through the tunnel like the rest of
# the app:
#
#   https://app.tandra.uk/pulse/p.js         →  umami:3000/p.js  (tracker script)
#   https://app.tandra.uk/pulse/p            →  umami:3000/p     (collect endpoint)
#   https://app.tandra.uk/pulse/recorder.js  →  heatmap/replay recorder script
#   https://app.tandra.uk/pulse/api/record   →  recorder ingest (needs the
#                                               tracker's session token)
#   https://app.tandra.uk/pulse/api/websites/<website id>/recorder
#                                            →  recorder settings (read-only,
#                                               unauthenticated in Umami), only
#                                               for the Tandra app and Tandra
#                                               site websites
#
# Nothing else under /pulse reaches umami (it falls through to the SPA), so
# the login and dashboard API stay off the public internet. The router rule
# is longer than tandra-web's `Host(app.tandra.uk)`, so Traefik's default
# rule-length priority picks it first. `/pulse` matches no generic EasyList /
# EasyPrivacy rule (checked 2026-10-22); `/stats`, `/metrics`, `/beacon` do.
#
# Infra shape (digest-pinned from day one):
#
#   umami     (umami-software/umami v3). Traefik on `dokploy-network`
#             routes `analytics.imapps.uk` → umami:3000 (LAN/tailnet) and
#             the two tracker paths above (public).
#   umami-db  (postgres:16-alpine) — bind-mounted /mnt/tank/shared/umami,
#             TZ=UTC (skip pg's America/Los_Angeles default; analytics
#             want day-boundary UTC).
#
# Tracker endpoints to make adblock lists less effective:
#   TRACKER_SCRIPT_NAME      = "p.js"            (was "script.js")
#   COLLECT_API_ENDPOINT     = "/p"              (was "/api/send")
#
# Cloudflare Access is intentionally NOT in use here. The `tandra.uk` zone
# has no Access apps, and the public router only exposes the tracker paths.

services:
  umami-db:
    image: postgres:16-alpine@sha256:1a66d744c1b459e13b05a8fca341da84cb63383e99ce262210efee5a319d4551
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - type: bind
        source: /mnt/tank/shared/umami
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - umami

  umami:
    image: docker.umami.is/umami-software/umami@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    container_name: umami
    restart: unless-stopped
    depends_on:
      - umami-db
    environment:
      # Look up umami-db on the internal `umami` network, not on
      # dokploy-network — keeps the analytics DB off every other app.
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_NAME: "Homelab Analytics"
      # Reduce exposure to common adblock / privacy lists.
      TRACKER_SCRIPT_NAME: p.js
      COLLECT_API_ENDPOINT: /p
      BASE_PATH: /
      # TZ UTC so day boundaries line up with what humans expect.
      TZ: UTC
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami-websecure.rule=Host(`analytics.imapps.uk`)"
      - "traefik.http.routers.umami-websecure.entrypoints=websecure"
      - "traefik.http.routers.umami-websecure.tls=true"
      - "traefik.http.routers.umami-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.umami-websecure.service=umami"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
      - "traefik.http.routers.umami-web.rule=Host(`analytics.imapps.uk`)"
      - "traefik.http.routers.umami-web.entrypoints=web"
      - "traefik.http.routers.umami-web.middlewares=redirect-to-https@docker"
      # Public tracker paths on the Tandra app host (see header comment).
      - "traefik.http.routers.umami-tracker.rule=Host(`app.tandra.uk`) && (Path(`/pulse/p.js`) || Path(`/pulse/p`) || Path(`/pulse/recorder.js`) || Path(`/pulse/api/record`) || Path(`/pulse/api/websites/b07e19e2-6c29-432f-a4f1-fe280b7f3794/recorder`) || Path(`/pulse/api/websites/dfe972ee-98e3-4732-b9b0-2427252f1435/recorder`))"
      - "traefik.http.routers.umami-tracker.entrypoints=websecure"
      - "traefik.http.routers.umami-tracker.tls=true"
      - "traefik.http.routers.umami-tracker.tls.certresolver=letsencrypt"
      - "traefik.http.routers.umami-tracker.service=umami"
      - "traefik.http.routers.umami-tracker.middlewares=umami-tracker-strip"
      - "traefik.http.middlewares.umami-tracker-strip.stripprefix.prefixes=/pulse"
    networks:
      - dokploy-network
      - umami

networks:
  umami:
    driver: bridge
  dokploy-network:
    external: true
